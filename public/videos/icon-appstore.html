<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vonai — App Store icon 1024</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1024px; height:1024px; overflow:hidden; }
  /* Sem cantos arredondados e sem transparência — a Apple arredonda e exige fundo opaco. */
  .icon { width:1024px; height:1024px; display:flex; align-items:center; justify-content:center;
          background:linear-gradient(135deg,#163670 0%, #1E4E9E 52%, #2C6FD0 100%);
          font-family:'Nunito',sans-serif; }
  .v { font-size:760px; font-weight:900; color:#fff; line-height:1; letter-spacing:-8px;
       text-shadow:0 10px 40px rgba(0,0,0,0.18); }
</style>
</head>
<body>
  <div class="icon"><div class="v">V</div></div>
</body>
</html>
